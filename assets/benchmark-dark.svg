<text x="229.7" y="102" font-size="12" font-weight="600" fill="#ffffff">25.4s</text>
<text x="708" y="86" font-size="17" font-weight="700" fill="#d95926" text-anchor="end">6.6x</text>
<text x="8" y="160" font-size="13" fill="#ffffff">a whole project directory</text>
<text x="8" y="177" font-size="11" fill="#c3c2b7">1,686,589 files</text>
