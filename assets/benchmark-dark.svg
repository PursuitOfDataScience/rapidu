<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="720" height="232" fill="#1a1a19"/>
<text x="40" y="26" font-size="15" font-weight="600" fill="#ffffff">Cold walk of a GPFS tree, wall time</text>
