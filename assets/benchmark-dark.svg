<text x="529" y="27" font-size="12" fill="#c3c2b7">rapiDU</text>
<text x="8" y="72" font-size="13" fill="#ffffff">a package cache</text>
<text x="8" y="89" font-size="11" fill="#c3c2b7">792,225 files</text>
<path d="M188,56 H406.9861333333333 a4,4 0 0 1 4,4 V78 a4,4 0 0 1 -4,4 H188 Z" fill="#3987e5"/>
<text x="419.0" y="74" font-size="12" font-weight="600" fill="#ffffff">168.1s</text>
