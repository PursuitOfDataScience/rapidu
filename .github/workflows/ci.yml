name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares >=3.6 and is verified by hand on the 3.6.8
        # /usr/bin/python3 of a RHEL8 login node, which is the deployment target
        # that motivates the stdlib-only constraint. These are the versions
        # GitHub runners still provide.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm needs full history + tags to derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=64" wheel setuptools-scm

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/ tests/

      - name: Test with pytest
        # TMPDIR is deliberately on a local filesystem here. On a networked
        # filesystem the fixture trees take tens of seconds to settle, which the
        # suite handles but which would slow CI down for no added coverage.
        run: |
          python -m pytest --cov=slurmdisk --cov-report=xml --cov-report=term --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
