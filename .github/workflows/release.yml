name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  # The gate. A tag push used to go straight to `build-and-publish`, with no
  # dependency on CI at all: a red suite on main did not stop a release, and a
  # PyPI upload cannot be taken back -- the version number is burned whether or
  # not the code works. GitHub cannot express `needs:` across workflow files, so
  # the check runs here, on the tagged commit, which is the commit being shipped
  # rather than whatever main happened to be when CI last ran.
  gate:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/ tests/
      - run: python -m pytest -q

  build-and-publish:
    name: Build & Publish to PyPI
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm needs full history + tags to derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build setuptools-scm
          python -m build

      - name: Verify tag matches built version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -m setuptools_scm)
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match OK"

      - name: Check artifacts with twine
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
